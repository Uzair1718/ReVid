[build]
  command = "npx prisma generate && npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Configure the Agent Scheduler (Cron Job)
# This requires the 'netlify/functions/agent-worker.ts' file
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
